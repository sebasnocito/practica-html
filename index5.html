<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en HTML</title>
</head>
<body>
    <h1>Listado de Personal</h1>
    <ul style="list-style-type:square;"> <!--UL= Unorder List (lista desordenada)-->
        <li>Juan</li> <!--LI= List Item es decir un elemento de esta lista-->
        <li>Karla</li>
        <li>Maria</li>
        <li>Carlos</li>
            <ul>
                <li>Argentina</li>
                <li>Paraguay</li>
                <li>Brasil</li>
            </ul>
</body>
</html>
